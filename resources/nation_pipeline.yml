resources:
  pipelines:
    nation_pipeline:
      name: nation_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      configuration:
        landing_volume_path: ${var.volume_path}/nation
        src_root: ${workspace.file_path}/src
      libraries:
        - file:
           path: ../src/nation/bronze_nation.py
        - file:
           path: ../src/nation/silver_nation.py