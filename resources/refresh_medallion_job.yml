resources:
  jobs:
    gold_customer_orders_refresh_job:
      name: gold_customer_orders_refresh_job
      tasks:
        - task_key: refresh_orders
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_pipeline.id}
        - task_key: refresh_customer
          depends_on:
            - task_key: refresh_orders
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_pipeline.id}
        - task_key: refresh_gold
          depends_on:
            - task_key: refresh_customer
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_customer_orders_pipeline.id}
