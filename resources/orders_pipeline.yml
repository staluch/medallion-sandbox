resources:
  pipelines:
    orders:
      name: orders_${bundle.target}
      catalog: ${var.catalog}
      target: ${var.schema}
      serverless: true
      channel: CURRENT
      continuous: false
      development: true
      configuration:
        volume_path: ${var.volume_path}
      libraries:
        - file:
            path: ${workspace.file_path}/src/bronze/orders.py
        - file:
            path: ${workspace.file_path}/src/silver/orders.py