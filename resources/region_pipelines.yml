resources:
  pipelines:
    region_pipelines:
      name: region_pipelines
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      configuration:
        landing_volume_path: ${var.volume_path}/region
        src_root: ${workspace.file_path}/src
      libraries:
        - file:
           path: ../src/region/bronze_region.py
        - file:
           path: ../src/region/silver_region.py