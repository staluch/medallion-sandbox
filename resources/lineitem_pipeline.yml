resources:
  pipelines:
    linetiem_pipeline:
      name: lineitem_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      configuration:
        landing_volume_path: ${var.volume_path}/lineitem
        src_root: ${workspace.file_path}/src
      libraries:
        - file:
           path: ../src/lineitem/bronze_lineitem.py
        - file:
           path: ../src/lineitem/silver_lineitem.py