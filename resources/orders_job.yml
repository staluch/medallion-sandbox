resources:
  jobs:
    orders:
      name: orders_${bundle.target}

      environments:
        - environment_key: default
          spec:
            client: "5"
            dependencies: []

      tasks:
        - task_key: bronze_ingest
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/src/bronze/orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume_path: ${var.volume_path}

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          environment_key: default
          notebook_task:
            notebook_path: ${workspace.file_path}/src/silver/orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}