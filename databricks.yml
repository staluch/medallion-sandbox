bundle:
  name: medallion-sandbox

include:
  - variables.yml
  - resources/*.yml

targets:
  dev:
    mode: development
    presets:
      name_prefix: '[dev ${workspace.current_user.short_name}] '
    variables:
      catalog: dev_medallion

  prod:
    mode: development
    presets:
      name_prefix: '[prod ${workspace.current_user.short_name}] '
    variables:
      catalog: prod_medallion